name: BassCraft
options:
  bundleIdPrefix: com.basscraft
  deploymentTarget:
    iOS: 16.0
  xcodeVersion: "15.0"
targets:
  BassCraft:
    type: application
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: .
        includes:
          - "*.swift"
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: "BassCraft Lab"
        CFBundleIdentifier: "com.basscraft.subwooferlab"
        CFBundleShortVersionString: "1.0.0"
        CFBundleVersion: "1"
        UILaunchScreen: {}
        UIBackgroundModes:
          - audio
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.basscraft.subwooferlab
        PRODUCT_NAME: BassCraft
        DEVELOPMENT_TEAM: ""
        CODE_SIGNING_ALLOWED: NO
        CODE_SIGNING_REQUIRED: NO
        CODE_SIGN_IDENTITY: ""
        SWIFT_VERSION: "5.9"
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: Info.plist
