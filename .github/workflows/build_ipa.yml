name: Build BassCraft iOS IPA

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    name: Build & Package IPA
    runs-on: macos-14

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select Xcode Version
        run: |
          sudo xcode-select -s /Applications/Xcode_15.4.app || sudo xcode-select -s /Applications/Xcode.app
          xcodebuild -version

      - name: List Schemes
        run: |
          xcodebuild -project BassCraft.xcodeproj -list

      - name: Build Archive (Unsigned)
        run: |
          xcodebuild archive \
            -project BassCraft.xcodeproj \
            -scheme BassCraft \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath build/BassCraft.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

      - name: Create IPA Package
        run: |
          mkdir -p build/Payload
          cp -r build/BassCraft.xcarchive/Products/Applications/BassCraft.app build/Payload/
          cd build
          zip -r -9 BassCraft.ipa Payload
          echo "IPA Size:"
          ls -lh BassCraft.ipa

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: BassCraft-iOS-IPA
          path: build/BassCraft.ipa
          if-no-files-found: error
          retention-days: 14
